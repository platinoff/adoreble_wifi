<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adoreble Wi-Fi</title>
<style>
  :root { color-scheme: dark; }
  body { background: #050a14; color: #c4b5fd; font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 18px; letter-spacing: .04em; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid #a78bfa; color: #a78bfa; font-size: 11px; }
  pre { background: #0b1220; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>Adoreble Wi-Fi <span class="badge">127.0.0.1:9770 · loopback</span></h1>
<p>ADO-0 scaffold. <code>/health</code>, <code>/api/status</code>, <code>/api/settings[/stage|/apply]</code>.</p>
<h2>Status</h2>
<pre id="status">loading…</pre>
<h2>Adapters</h2>
<pre id="adapters">loading…</pre>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
async function get(path) {
  const r = await fetch(path);
  return r.json();
}
(async () => {
  document.getElementById('status').textContent = JSON.stringify(await get('/api/status'), null, 2);
  document.getElementById('adapters').textContent = JSON.stringify(await get('/api/adapters'), null, 2);
})();
</script>
</body>
</html>
