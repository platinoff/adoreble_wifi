[package]
name = "adoreble-cli"
description = "adoreble-wifi — control CLI for Adoreble Wi-Fi"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "adoreble-wifi"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "native-tls"] }
adoreble-core = { path = "../adoreble-core" }

[target.'cfg(windows)'.dependencies]
adoreble-windows = { path = "../adoreble-windows" }

[target.'cfg(not(windows))'.dependencies]
adoreble-linux = { path = "../adoreble-linux" }
