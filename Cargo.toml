[workspace]
resolver = "2"
members = [
    "crates/adoreble-core",
    "crates/adoreble-windows",
    "crates/adoreble-linux",
    "crates/adoreble-api",
    "crates/adoreble-cli",
    "crates/adoreble-ui",
    "crates/adoreble-xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/platinoff/adoreble_wifi"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
